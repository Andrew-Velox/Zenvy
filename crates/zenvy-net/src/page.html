<style>
/* Palette: #F5F5F7 / #1D1D1F / #AAAAAA neutrals with one #007AFF accent (no gradients, no purple). Dark is the default; [data-theme=light] overrides.
   --primary-ink is the accent used as TEXT: a shade that keeps 4.5:1 contrast on each theme's surfaces. */
:root{
  --surface:#1d1d1f;--surface-low:#262628;--surface-c:#2b2b2d;--surface-high:#343437;--surface-highest:#3e3e41;
  --on-surface:#f5f5f7;--on-surface-v:#aaaaaa;--outline:#7c7c80;--outline-v:#404043;
  --primary:#007aff;--primary-ink:#5eadff;--on-primary:#ffffff;--primary-c:#0b3f78;--on-primary-c:#d3e6ff;
  --secondary-c:#38383b;--on-secondary-c:#f5f5f7;
  --error:#ff6b63;--good:#4fd17e;--warn:#ffb340;
  --inverse:#f5f5f7;--on-inverse:#1d1d1f;--logo-accent:var(--primary);
  --glass:rgba(118,118,128,.30);--glass-top:rgba(29,29,31,.84);--glass-line:rgba(255,255,255,.13);--glass-hi:rgba(255,255,255,.24);--glass-active:rgba(255,255,255,.16);--glass-shadow:0 12px 32px rgba(0,0,0,.35);--card-line:rgba(255,255,255,.06);
  --ease:cubic-bezier(.2,0,0,1);--safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
[data-theme=light]{
  --surface:#f5f5f7;--surface-low:#ffffff;--surface-c:#eeeef1;--surface-high:#e7e7eb;--surface-highest:#dfdfe4;
  --on-surface:#1d1d1f;--on-surface-v:#636368;--outline:#8e8e93;--outline-v:#d9d9de;
  --primary:#007aff;--primary-ink:#0062cc;--on-primary:#ffffff;--primary-c:#d6e8ff;--on-primary-c:#002e66;
  --secondary-c:#e6e6ea;--on-secondary-c:#1d1d1f;
  --error:#d70015;--good:#1c7a3b;--warn:#a85a00;
  --inverse:#1d1d1f;--on-inverse:#f5f5f7;color-scheme:light;
  --glass:rgba(255,255,255,.66);--glass-top:rgba(245,245,247,.86);--glass-line:rgba(0,0,0,.08);--glass-hi:rgba(255,255,255,1);--glass-active:rgba(0,0,0,.07);--glass-shadow:0 10px 28px rgba(0,0,0,.12);--card-line:rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{position:relative;background:var(--surface);color:var(--on-surface);font:400 16px/24px "Google Sans Text","Google Sans",Roboto,"Noto Sans",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;transition:background-color .25s var(--ease),color .25s var(--ease)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;position:relative;overflow:hidden}
/* state layer: the M3 pressed/hover overlay */
button::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;pointer-events:none;transition:opacity .15s var(--ease)}
button:active::after{opacity:.12}
.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:18px;height:18px}

/* glass: translucent frosted surfaces (blur + saturation, a specular top edge and a hairline). Solid fallback when blur is unavailable. */
#top,#nav,.fab{will-change:transform;transform:translateZ(0);background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%)}
#top{position:absolute;top:0;left:0;right:0;z-index:4;background:var(--glass-top);-webkit-backdrop-filter:blur(22px) saturate(110%);backdrop-filter:blur(22px) saturate(110%);box-shadow:inset 0 -1px 0 var(--glass-line)}
#nav,.fab{box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 1px var(--glass-line),var(--glass-shadow)}
.card,.mcard,.bigempty{box-shadow:inset 0 0 0 1px var(--card-line)}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){#top,#nav,.fab{background:var(--surface-c)}}
/* top app bar */
#appbar{flex:none;height:64px;padding:0 4px 0 16px;display:flex;align-items:center;gap:4px}
#appbar.back{padding-left:4px}
#title{flex:1;margin:0;font-size:22px;line-height:28px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{flex:none;width:48px;height:48px;border-radius:24px;display:grid;place-items:center;color:var(--on-surface-v)}
.status{display:flex;align-items:center;gap:8px;height:32px;min-width:40px;justify-content:center;padding:0 10px;border-radius:16px;background:var(--glass-active);box-shadow:inset 0 1px 0 var(--glass-hi);font-size:13px;line-height:16px;font-weight:500;color:var(--on-surface-v);font-variant-numeric:tabular-nums}
.status b{font-weight:500}.status b:empty{display:none}
.status[data-k=wifi] .i{color:var(--good)}.status[data-k=spin] .i{color:var(--primary-ink)}.status[data-k=wifioff] .i{color:var(--error)}.status[data-k=unlink] .i{color:var(--on-surface-v)}
@keyframes zspin{to{transform:rotate(360deg)}}.i.spin{animation:zspin .9s linear infinite}

/* workspace chips */
#wsbar{flex:none;display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
#wsbar::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--outline);font-size:14px;line-height:20px;font-weight:500;color:var(--on-surface-v);transition:background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease)}
.chip.on{background:var(--secondary-c);border-color:transparent;color:var(--on-secondary-c)}
.chip em{font-style:normal;font-size:12px;opacity:.7}
.chip.assist{border-color:var(--outline-v);color:var(--on-surface)}
.chip.mod.on{background:var(--primary-c);color:var(--on-primary-c)}

/* views */
#view{position:absolute;inset:0}
.view{position:absolute;inset:0;overflow-y:auto;padding:calc(var(--top-h,64px) + 8px) 16px calc(var(--nav-h,0px) + 24px);animation:fadein .14s linear}
.view.fill{display:flex;flex-direction:column;overflow:hidden;padding-bottom:calc(var(--nav-h,0px) + 8px)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
h2{margin:24px 0 8px;padding:0 4px;font-size:14px;line-height:20px;font-weight:500;color:var(--primary-ink)}
h2:first-child{margin-top:8px}
.headrow{display:flex;align-items:center;justify-content:space-between;margin:20px 0 8px}
.headrow h2{margin:0}

/* segmented button */
.segb{display:flex;height:40px;border:1px solid var(--outline);border-radius:20px;overflow:hidden}
.segb button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;font-size:14px;font-weight:500;color:var(--on-surface);border-left:1px solid var(--outline)}
.segb button:first-child{border-left:0}
.segb button.on{background:var(--secondary-c);color:var(--on-secondary-c)}
.segb button{white-space:nowrap}
.segb.sm{height:32px;border-radius:16px;flex:none}.segb.sm button{flex:none;padding:0 12px;font-size:13px}

/* lists */
.card{background:var(--surface-low);border-radius:20px;overflow:hidden}
.li{display:flex;align-items:center;min-height:72px;border-top:1px solid var(--outline-v)}
.li:first-child{border-top:0}
.li-main{flex:1;min-width:0;display:flex;align-items:center;gap:16px;padding:12px 4px 12px 16px;min-height:72px;text-align:left}
.avatar.ico{background:var(--surface-highest)}.avatar img{width:26px;height:26px;object-fit:contain;display:block;pointer-events:none}
.avatar{flex:none;width:40px;height:40px;border-radius:20px;background:var(--surface-highest);color:var(--on-surface-v);display:grid;place-items:center;font-size:16px;font-weight:500}
.li.act .avatar{background:var(--primary-c);color:var(--on-primary-c)}
.li-txt{min-width:0;display:flex;flex-direction:column}
.li-txt b{font-weight:400;font-size:16px;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-txt small{font-size:14px;line-height:20px;color:var(--on-surface-v);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .ibtn.x{width:56px;height:72px;border-radius:0}
.li .ibtn.x.arm{color:var(--error);font-weight:500;font-size:14px}
.empty{padding:24px 16px;color:var(--on-surface-v);font-size:14px}
.glabel{margin:16px 4px 8px;font-size:12px;line-height:16px;font-weight:500;color:var(--on-surface-v)}
.tabsbtn{flex:none;display:flex;align-items:center;gap:4px;height:32px;padding:0 10px;margin-right:4px;border-radius:8px;background:var(--surface-high);font-size:13px;font-weight:500;color:var(--on-surface-v)}
.tabsbtn.on{background:var(--secondary-c);color:var(--on-secondary-c)}
.tabsbtn .i{width:16px;height:16px;transition:transform .2s var(--ease)}.tabsbtn.on .i{transform:rotate(180deg)}
.tabs{background:var(--surface-c);border-top:1px solid var(--outline-v);max-height:min(56vh,420px);overflow-y:auto;overscroll-behavior:contain}
.trow{display:flex;align-items:center;min-height:56px;border-top:1px solid var(--outline-v)}
.trow:first-child{border-top:0}
.tmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px 4px 8px 16px;min-height:56px;text-align:left}
.fav{flex:none;width:32px;height:32px;border-radius:8px;background:var(--surface-highest);display:grid;place-items:center;font-size:13px;font-weight:500;color:var(--on-surface-v)}
.trow.act .fav{background:var(--primary-c);color:var(--on-primary-c)}
.trow .li-txt b{font-size:15px;line-height:20px}.trow .li-txt small{font-size:13px;line-height:16px}
.tx{flex:none;width:48px;height:56px;display:grid;place-items:center;color:var(--on-surface-v)}.tx.arm{color:var(--error);font-weight:500;font-size:13px}
.newtab{display:flex;align-items:center;gap:12px;width:100%;height:52px;padding:0 20px;border-top:1px solid var(--outline-v);color:var(--primary-ink);font-size:14px;font-weight:500}
/* icon-led rows */
#m-listen,#m-audio,#m-bright{margin-top:12px}#m-audio .card+.card{margin-top:12px}
.lead{flex:none;width:40px;height:40px;border-radius:20px;background:var(--surface-highest);color:var(--on-surface-v);display:grid;place-items:center}
.lead.on{background:var(--primary-c);color:var(--on-primary-c)}
.slrow{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 16px;border-top:1px solid var(--outline-v)}
.slrow:first-child{border-top:0}
.slrow input[type=range]{flex:1;min-width:0;width:auto}
.slrow .val{flex:none;width:44px;text-align:right;font-style:normal;font-size:14px;color:var(--on-surface-v);font-variant-numeric:tabular-nums}
.slrow .nm{flex:1;min-width:0;font-size:14px;line-height:20px;color:var(--on-surface-v);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slrow>.i{color:var(--on-surface-v)}
.ibtn.off{background:var(--error);color:var(--surface)}
.ibtn.go{background:var(--primary);color:var(--on-primary)}
.set-row>.i{color:var(--on-surface-v)}
.set-row .li-txt{flex:1}
.empty{display:flex;align-items:center;gap:12px}.empty .i{color:var(--outline)}
.bigempty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:32px 16px;background:var(--surface-low);border-radius:28px;color:var(--on-surface-v);font-size:16px}
.bigempty .i{width:40px;height:40px;color:var(--outline)}
.setup{padding:16px;background:var(--surface-c);border-top:1px solid var(--outline-v);font-size:14px;line-height:20px;color:var(--on-surface-v)}
.setup ol{margin:8px 0;padding-left:20px}.setup code,.gate code{padding:1px 6px;border-radius:6px;background:var(--surface-highest);color:var(--on-surface);font:13px ui-monospace,monospace}

/* touchpad */
#padwrap{flex:1;min-height:0;position:relative;border-radius:28px;background:var(--surface-low);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(var(--outline-v) 1.2px,transparent 1.6px);background-size:28px 28px;background-position:14px 14px}
#trace{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#hint span{display:flex;flex-direction:column;align-items:center;gap:8px}#hint .i{width:28px;height:28px}
#rail{position:absolute;top:16px;right:0;bottom:16px;width:44px;display:flex;align-items:center;justify-content:center}
#rail i{width:4px;height:56px;border-radius:2px;background:var(--outline-v)}
#hint{position:absolute;left:24px;right:64px;top:50%;transform:translateY(-50%);display:flex;justify-content:center;gap:28px;font-size:13px;line-height:16px;color:var(--on-surface-v);opacity:.8;transition:opacity .3s var(--ease);pointer-events:none}
.fab{position:absolute;left:16px;bottom:16px;width:56px;height:56px;border-radius:20px;color:var(--on-surface);display:grid;place-items:center}
.padbar{flex:none;display:flex;gap:8px;margin-top:12px}
.pbtn{height:56px;border-radius:20px;background:var(--secondary-c);color:var(--on-secondary-c);font-size:15px;font-weight:500;display:grid;place-items:center;transition:transform .12s var(--ease)}
.pbtn.down{transform:scale(.98)}.pbtn.down::after{opacity:.16}
.pbtn.l{flex:3}.pbtn.m{flex:1}.pbtn.r{flex:3}
.typing{flex:none;margin-top:12px;padding:12px;border-radius:24px;background:var(--surface-c);display:flex;flex-direction:column;gap:8px}
.trowline{display:flex;align-items:center;gap:8px}

/* text field + keys */
.field{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:0 16px;min-height:56px;border-radius:16px;border:1px solid var(--outline);color:var(--on-surface-v);transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.field:focus-within{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);color:var(--on-surface)}
.field textarea{flex:1;min-width:0;height:24px;margin:16px 0;padding:0;border:0;outline:0;background:none;color:var(--on-surface);font:inherit;resize:none;overflow:hidden}
.field textarea::placeholder{color:var(--on-surface-v)}
.tbtn{flex:none;height:40px;padding:0 16px;border-radius:20px;color:var(--primary-ink);font-size:14px;font-weight:500}
.keys{display:grid;gap:8px;margin-top:8px}
.k{height:52px;min-width:0;padding:0 8px;border-radius:16px;background:var(--secondary-c);color:var(--on-secondary-c);display:grid;place-items:center;font-size:15px;font-weight:500;transition:transform .12s var(--ease)}
.k:active{transform:scale(.97)}
.k.t{background:var(--surface-high);color:var(--on-surface)}
.k.s{height:44px;font-size:14px}
.k.on{background:var(--primary-c);color:var(--on-primary-c)}
.r4{grid-template-columns:repeat(4,1fr)}.r5{grid-template-columns:repeat(5,1fr)}.r6{grid-template-columns:repeat(6,1fr)}
.cluster{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}.cluster .keys{margin-top:0}
.arrows{grid-template-columns:repeat(3,1fr);grid-template-areas:". u ." "l d r"}
.arrows .u{grid-area:u}.arrows .l{grid-area:l}.arrows .d{grid-area:d}.arrows .r{grid-area:r}
.frow{display:flex;gap:8px;overflow-x:auto;margin:8px -16px 0;padding:0 16px;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}.frow .k{flex:none;min-width:52px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.xkeys{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.xkeys::-webkit-scrollbar{display:none}
.xkeys .k{flex:none;min-width:48px;height:40px;border-radius:12px;font-size:13px}

/* bottom navigation */
#nav{position:absolute;left:12px;right:12px;bottom:calc(10px + var(--safe-b));z-index:4;display:flex;padding:8px;border-radius:32px}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:56px;color:var(--on-surface-v);font-size:12px;line-height:16px;font-weight:500;overflow:visible}
#nav button::after{display:none}
#nav .pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background-color .2s var(--ease),color .2s var(--ease)}
#nav button:active .pill{background:var(--glass-active)}
#nav button.on{color:var(--on-surface)}
#nav button.on .pill{background:var(--glass-active);color:var(--on-surface);box-shadow:inset 0 1px 0 var(--glass-hi)}

/* gate */
#v-gate{display:flex;flex-direction:column;justify-content:center;padding-bottom:96px}
.gicon{width:64px;height:64px;border-radius:32px;background:var(--primary-c);color:var(--on-primary-c);display:grid;place-items:center;margin-bottom:24px}.gicon .i{width:32px;height:32px}
.gate h1{margin:0 0 8px;font-size:28px;line-height:36px;font-weight:400}
.gate p{margin:0;color:var(--on-surface-v);font-size:16px;line-height:24px;max-width:30em}
.code{margin:24px 0;padding:24px;border-radius:28px;background:var(--primary-c);color:var(--on-primary-c);font-size:48px;line-height:56px;font-weight:500;letter-spacing:.2em;text-align:center;font-variant-numeric:tabular-nums}

/* settings */
.set-row{display:flex;align-items:center;gap:16px;min-height:64px;padding:8px 16px;border-top:1px solid var(--outline-v)}
.set-row:first-child{border-top:0}
.set-row .li-txt{flex:1}
.set-col{padding:12px 16px;border-top:1px solid var(--outline-v)}
.set-col:first-child{border-top:0}
.set-col .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.set-col em{font-style:normal;color:var(--on-surface-v);font-size:14px;font-variant-numeric:tabular-nums}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:32px;border-radius:16px;background:var(--surface-highest);border:2px solid var(--outline);position:relative;cursor:pointer;transition:background-color .2s var(--ease),border-color .2s var(--ease)}
.sw::before{content:"";position:absolute;top:50%;left:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transform:translateY(-50%);transition:left .2s var(--ease),width .2s var(--ease),height .2s var(--ease),background-color .2s var(--ease)}
.sw:checked{background:var(--primary);border-color:var(--primary)}
.sw:checked::before{left:20px;width:24px;height:24px;background:var(--on-primary)}
input[type=range]{width:100%;accent-color:var(--primary);height:32px;margin:0}

/* ---------- pairing + connection ---------- */
async function pairNow(secret){
  // Non-extractable private key: it can sign but can never be read out of the browser.
  const kp=await crypto.subtle.generateKey({name:'Ed25519'},false,['sign','verify']);
  const raw=await crypto.subtle.exportKey('raw',kp.publicKey);
  const h=new Uint8Array(await crypto.subtle.digest('SHA-256',raw));
  const code=String(((h[0]*16777216)+(h[1]<<16)+(h[2]<<8)+h[3])%10000).padStart(4,'0');
  gate('Approve on your PC','Match this code, then tap Approve.',code,'shield');
  live('wait','Pairing');
  const name=(window.ZenvyApp&&ZenvyApp.deviceName())||(navigator.userAgentData&&navigator.userAgentData.platform?'Android phone':'phone');
  const r=await fetch('/api/pair',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({secret,name,pubkey:b64u(raw)})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  await kv.set('device',{id:j.device_id,key:kp.privateKey});
  history.replaceState(null,'',location.pathname);
}
async function connect(){
  const dev=await kv.get('device');
  if(!dev){live('off','Not paired');gate('Not paired','Run <code>zenvyd pair</code> on the PC and scan the QR code.',null,'unlink');return}
  live('wait','Connecting');
  ws=new WebSocket('wss://'+location.host+'/ws');
  ws.binaryType='arraybuffer';iconAsked.clear();
  ws.onmessage=async e=>{
    if(typeof e.data!=='string'){onAudioFrame(e.data);return}
    const m=JSON.parse(e.data);
    if(m.id&&rpcCbs[m.id]){const cb=rpcCbs[m.id];delete rpcCbs[m.id];cb(m);return}
    if(m.t==='challenge'){

/* ---------- phone speaker: the PC's audio played on this phone ---------- */
let listenState='off',listenErr='',actx=null,adec=null,again=null,wnode=null,wstat={fill:0,target:0,under:0,trims:0},statT=0;
const canListen=()=>!!(caps&&caps.capabilities&&caps.capabilities['audio.listen']&&caps.capabilities['audio.listen'].state==='available');
function onAudioFrame(buf){
  if(listenState==='off'||!adec||adec.state!=='configured')return;
  const v=new DataView(buf);if(buf.byteLength<=5||v.getUint8(0)!==1)return;
  if(adec.decodeQueueSize>8)return; // never let decoding fall behind real time
  adec.decode(new EncodedAudioChunk({type:'key',timestamp:v.getUint32(1,true)*20000,data:new Uint8Array(buf,5)}));
}
// Decoded audio goes straight to the audio thread (zenvy-pcm), which owns buffering: page work cannot make it late.
function onPcm(ad){
  try{
    if(!wnode)return;
    const n=ad.numberOfFrames,l=new Float32Array(n),r=new Float32Array(n);
    ad.copyTo(l,{planeIndex:0,format:'f32-planar'});
    ad.copyTo(r,{planeIndex:ad.numberOfChannels>1?1:0,format:'f32-planar'});
    wnode.port.postMessage({l,r},[l.buffer,r.buffer]);
  }finally{ad.close()}
}
async function startListen(){
  if(!('AudioDecoder' in window)||!('EncodedAudioChunk' in window)){listenErr='This phone’s browser cannot play the stream (no audio decoder).';renderListen();return}
  if(!window.AudioWorkletNode){listenErr='This phone’s browser cannot play the stream (no audio worklet).';renderListen();return}
  listenErr='';listenState='starting';renderListen();
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:48000,latencyHint:'interactive'});
    await actx.resume(); // must happen inside the tap that started it
    await actx.audioWorklet.addModule('/audio-worklet.js');
    wnode=new AudioWorkletNode(actx,'zenvy-pcm',{numberOfInputs:0,outputChannelCount:[2],processorOptions:{target:prefs.ltarget}});
    wstat={fill:0,target:prefs.ltarget,under:0,trims:0};
    wnode.port.onmessage=e=>{wstat=e.data};
    again=actx.createGain();again.gain.value=prefs.lvol;wnode.connect(again);again.connect(actx.destination);
    adec=new AudioDecoder({output:onPcm,error:e=>{listenErr='Audio decoder error: '+e.message;stopListenLocal('');sendListen({cmd:'stop'});renderListen()}});
    adec.configure({codec:'opus',sampleRate:48000,numberOfChannels:2});
    sendListen({cmd:'start',mute_pc:prefs.mutePc},'listen-start');
    clearInterval(statT);statT=setInterval(()=>{if(view==='media')updateListenStats()},500);
  }catch(e){listenErr='Could not start audio: '+e.message;stopListenLocal('');renderListen()}
}
function stopListenLocal(reason){
  clearInterval(statT);
  if(wstat.target>=0.04&&wstat.target<=0.4&&listenState==='on'){prefs.ltarget=Math.round(wstat.target*1000)/1000;savePrefs()} // remember what this Wi-Fi needed
  try{if(wnode)wnode.disconnect()}catch(e){}
  try{if(adec&&adec.state!=='closed')adec.close()}catch(e){}
  try{if(actx&&actx.state!=='closed')actx.close()}catch(e){}
  adec=null;actx=null;again=null;wnode=null;
  const was=listenState!=='off';listenState='off';
  if(reason&&was){snack(reason==='permission removed'?'Listening was turned off on the PC':reason)}
  if(view==='media')renderListen();
}
function stopListen(){sendListen({cmd:'stop'});stopListenLocal('')}
function updateListenStats(){
  const el=$('lstat');if(!el||!actx)return;
  const dev=Math.round((actx.outputLatency||actx.baseLatency||0)*1000),buf=Math.round(wstat.fill*1000);
  el.textContent=(wstat.playing===false&&wstat.fill<wstat.target?'Buffering…':(buf+dev)+' ms')+(wstat.under?' · '+wstat.under+(wstat.under===1?' gap':' gaps'):'');
}
function renderListen(){
  const el=$('m-listen');
  if(!canListen()){el.innerHTML='';return}
  const on=listenState==='on',busy=listenState==='starting';
  el.innerHTML='<div class="card"><div class="slrow"><span class="lead'+(on?' on':'')+'">'+ic('headphones')+'</span><span class="nm" id="lstat" style="color:var(--on-surface)">'+(on?'Starting\u2026':busy?'Connecting\u2026':'Phone speaker')+'</span>'+
    '<button class="ibtn '+(on?'tonal':'go')+'" id="lbtn" aria-label="'+(on?'Stop listening':'Start listening')+'"'+(busy?' disabled':'')+'>'+ic(on?'stop':'play')+'</button></div>'+
    (listenErr?'<div class="setup" style="border-radius:0">'+ic('info','s')+' '+esc(listenErr).replace(/zenvyd grant ([A-Za-z0-9_-]+) listen/,'<code>zenvyd grant $1 listen</code>')+'</div>':'')+
    '<div class="slrow">'+ic('phone')+'<input type="range" id="lvol" min="0" max="100" step="1" value="'+Math.round(prefs.lvol*100)+'" aria-label="Phone volume"><em class="val" id="lvolv">'+Math.round(prefs.lvol*100)+'%</em></div>'+
    '<div class="slrow"><button class="chip'+(prefs.mutePc?' on':'')+'" id="lmute" aria-pressed="'+(prefs.mutePc?'true':'false')+'" aria-label="Mute PC speakers while listening">'+ic('mute','s')+'Mute PC</button></div></div>';
  $('lbtn').onclick=()=>{buzz();on?stopListen():startListen()};
  $('lmute').onclick=e=>{prefs.mutePc=!prefs.mutePc;savePrefs();e.currentTarget.classList.toggle('on',prefs.mutePc);e.currentTarget.setAttribute('aria-pressed',prefs.mutePc)};
  $('lvol').oninput=e=>{prefs.lvol=e.target.value/100;$('lvolv').textContent=e.target.value+'%';if(again)again.gain.value=prefs.lvol};
  $('lvol').onchange=savePrefs;
  if(on)updateListenStats();
}

    num('12',0,-52)+num('3',54,0)+num('6',0,56)+num('9',-54,0)+
    '<g id="lk-mh" style="transform-origin:0 0"><line x1="0" y1="0" x2="0" y2="-52" stroke="currentColor" stroke-width="8" stroke-linecap="round"/></g><g id="lk-hh" style="transform-origin:0 0"><line x1="0" y1="0" x2="0" y2="-34" stroke="currentColor" stroke-width="10" stroke-linecap="round"/></g><circle r="6" fill="var(--primary)"/>'+
    '<circle cx="-62" cy="-62" r="17" fill="var(--fill-3)" stroke="var(--glass-line)"/><text id="lk-hn" x="-62" y="-61" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="currentColor"></text>'+
    '<circle cx="64" cy="62" r="17" fill="var(--fill-3)" stroke="var(--glass-line)"/><text id="lk-mn" x="64" y="63" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="currentColor"></text></svg>';

function tickClock(){

/* the dock: password pill with an arrow, and sleep / power / restart like the PC lock screen */

function doUnlockDock(){

addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function onPowerEvent(topic,v){
  if(topic==='power.state'){power=v;renderPower();return true}
  if(topic==='power.scheduled'){pwrSched={id:v.id,action:v.action,until:Date.now()+v.delay_ms,by:v.by};pwrAction=v.action;openSheet('count');startPwrTimer();return true}
  if(topic==='power.cancelled'){pwrSched=null;clearInterval(pwrTimer);if(pwrView==='count'){closeSheet(true);snack('Cancelled')}return true}
  if(topic==='power.executing'){if(pwrSched){pwrSched.running=true;if(pwrView==='count')renderSheet()}return true}
  if(topic==='power.failed'){pwrSched=null;clearInterval(pwrTimer);pwrAction=null;if(pwrView!=='menu')openSheet('menu');pwrErr=v.message||'It did not work';renderSheet();return true}
  return false;
}

    (window.ZenvyApp?'<button class="danger" id="forget">'+ic('unlink','s')+'Forget this PC</button>':'')+

  const s=$('v-settings');

/* ---------- shared keyboard logic ---------- */
const mods=new Set();
function renderMods(){document.querySelectorAll('[data-mod]').forEach(b=>b.classList.toggle('on',mods.has(b.dataset.mod)))}
function clearMods(){mods.clear();renderMods()}
let txtBuf='',txtT=0;
function flushText(){clearTimeout(txtT);txtT=0;if(!txtBuf)return;const cps=[...txtBuf];txtBuf='';for(let i=0;i<cps.length;i+=200)sendInput({cmd:'text',text:cps.slice(i,i+200).join('')})}
// Fast typing arrives one character at a time; batching ~25 ms of it into one command keeps the PC from spawning a typer per letter.
function queueText(t){txtBuf+=t;if(!txtT)txtT=setTimeout(flushText,25)}
function key(k,extra,noClear){flushText();sendInput({cmd:'key',key:k,mods:extra||[...mods]});if(!noClear)clearMods()}
function keyButton(host,html,fn,o={}){
  const b=document.createElement('button');b.className=o.cls||'k';b.innerHTML=html;if(o.label)b.setAttribute('aria-label',o.label);if(o.mod)b.dataset.mod=o.mod;
  b.onpointerdown=e=>e.preventDefault(); // keep focus in the text field so the soft keyboard stays open
  if(o.rep){ // press and hold repeats, like a real key
    let t1=0,t2=0;const stop=()=>{clearTimeout(t1);clearInterval(t2);t1=t2=0};
    b.addEventListener('pointerdown',()=>{buzz();fn();t1=setTimeout(()=>{t2=setInterval(()=>{fn()},55)},420)});
    for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,stop);
  }else b.onclick=()=>{buzz();fn()};
  (typeof host==='string'?$(host):host).append(b);return b;
}
/*attachText:start*/
/** What changed between two versions of the text field: how many characters to delete, then what to type. */
function diffText(prev,cur){const a=[...prev],b=[...cur];let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;return{back:a.length-i,add:b.slice(i).join('')}}
function attachText(kb){
  let prev='',composing=false;
  const sync=()=>{const cur=kb.value;if(cur===prev)return;const d=diffText(prev,cur);
    for(let k=0;k<d.back;k++)key('backspace',[],true);
    const add=d.add;
    if(add){if([...add].length===1&&mods.size){const c=add.toLowerCase();if(/^[a-z0-9]$/.test(c))key(c);else if(c===' ')key('space');else{queueText(add);clearMods()}}else{queueText(add);clearMods()}}
    prev=cur;
    // keep the field short, but only at a word boundary and never in the middle of a composition
    if(cur.length>120&&!composing&&/\s$/.test(cur)){kb.value='';prev=''}};
  // Android keyboards hold the word being typed in a "composition" until you press space. Live typing sends
  // that text as it changes (the diff turns autocorrect and suggestion taps into backspaces + the new word).
  kb.addEventListener('compositionstart',()=>{composing=true});
  kb.addEventListener('compositionend',()=>{composing=false;sync()});
  kb.addEventListener('input',e=>{if(!e.isComposing||prefs.live)sync()});
  kb.addEventListener('beforeinput',e=>{if(e.inputType==='insertLineBreak'||e.inputType==='insertParagraph'){e.preventDefault();key('enter')}});
  kb.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();key('enter')}else if(e.key==='Backspace'&&kb.value===''){key('backspace',[],true)}});
}
/*attachText:end*/

/* ---------- touchpad ---------- */
let sizeTrace=()=>{};
(function initPad(){
  const wrap=$('padwrap'),cv=$('trace'),ctx=cv.getContext('2d'),ptrs=new Map();
  let mode=null,moved=0,tapT=0,lastTap=0,twoT=0,twoMoved=0,rem={x:0,y:0},pend={x:0,y:0},sc=0,raf=0,lastMoveT=0,dragging=false,dpr=1;
  const trail=[];let tr=0;
  const prim=()=>getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();
  sizeTrace=()=>{dpr=window.devicePixelRatio||1;const r=wrap.getBoundingClientRect();if(!r.width)return;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr)};
  new ResizeObserver(sizeTrace).observe(wrap);
  const rgba=(a)=>{const c=prim();const m=/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(c);return m?'rgba('+parseInt(m[1],16)+','+parseInt(m[2],16)+','+parseInt(m[3],16)+','+a+')':c};
  const draw=()=>{tr=0;const now=performance.now();ctx.clearRect(0,0,cv.width,cv.height);
    while(trail.length&&now-trail[0].t>450)trail.shift();
    if(!trail.length&&!ptrs.size)return;
    ctx.lineCap='round';ctx.lineJoin='round';
    for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i];if(b.brk)continue;const age=1-(now-b.t)/450;ctx.strokeStyle=rgba(Math.max(0,age*.6));ctx.lineWidth=(2+age*4)*dpr;ctx.beginPath();ctx.moveTo(a.x*dpr,a.y*dpr);ctx.lineTo(b.x*dpr,b.y*dpr);ctx.stroke()}
    for(const p of ptrs.values()){const x=p.cx*dpr,y=p.cy*dpr;ctx.fillStyle=rgba(.16);ctx.beginPath();ctx.arc(x,y,28*dpr,0,7);ctx.fill();ctx.fillStyle=rgba(.95);ctx.beginPath();ctx.arc(x,y,5*dpr,0,7);ctx.fill()}
    tr=requestAnimationFrame(draw)};
  const kick=()=>{if(!tr)tr=requestAnimationFrame(draw)};
  const local=e=>{const r=wrap.getBoundingClientRect();return{cx:e.clientX-r.left,cy:e.clientY-r.top}};
  const flush=()=>{raf=0;const o={};
    for(const k of ['x','y']){const v=pend[k]+rem[k];const i=Math.trunc(v);rem[k]=v-i;pend[k]=0;o[k]=i}
    if(o.x||o.y)sendInput({cmd:'pointer_move',dx:o.x,dy:o.y});
    if(Math.abs(sc)>=1){const n=Math.trunc(sc);sc-=n;sendInput({cmd:'scroll',dx:0,dy:n})}};
  const sched=()=>{if(!raf)raf=requestAnimationFrame(flush)};
  const hint=$('hint');let hinted=false;
  const scrollDir=()=>prefs.natural?-1:1;
  wrap.addEventListener('pointerdown',e=>{if(e.target.closest('.fab'))return;wrap.setPointerCapture(e.pointerId);const l=local(e);
    const inRail=l.cx>wrap.clientWidth-44;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,...l,rail:inRail});
    if(!hinted){hinted=true;hint.style.opacity=0}
    trail.push({x:l.cx,y:l.cy,t:performance.now(),brk:true});kick();
    if(inRail){mode='rail';return}
    if(ptrs.size===1){tapT=e.timeStamp;moved=0;lastMoveT=e.timeStamp;
      if(e.timeStamp-lastTap<300){mode='drag';dragging=true;sendInput({cmd:'button',button:'left',state:'down'})}else mode='move'}
    else if(ptrs.size===2){mode='scroll';twoT=e.timeStamp;twoMoved=0}});
  wrap.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
    for(const c of (e.getCoalescedEvents?e.getCoalescedEvents():[e])){
      const dx=c.clientX-p.x,dy=c.clientY-p.y;p.x=c.clientX;p.y=c.clientY;
      if(mode==='rail'){sc+=scrollDir()*dy/8;continue}
      if(ptrs.size===1){moved+=Math.abs(dx)+Math.abs(dy);const dt=Math.max(1,c.timeStamp-lastMoveT);lastMoveT=c.timeStamp;
        const gain=prefs.speed*(prefs.accel?1+Math.min(Math.hypot(dx,dy)/dt,3)*0.6:1);pend.x+=dx*gain;pend.y+=dy*gain}
      else if(ptrs.size===2){twoMoved+=Math.abs(dx)+Math.abs(dy);sc+=scrollDir()*dy/2/8}}
    const l=local(e);p.cx=l.cx;p.cy=l.cy;trail.push({x:l.cx,y:l.cy,t:performance.now()});kick();sched()});
  const end=(e,cancel)=>{if(!ptrs.has(e.pointerId))return;const n=ptrs.size,was=mode;ptrs.delete(e.pointerId);kick();
    if(was==='rail'){if(n===1)mode=null;return}
    if(n===1){
      if(mode==='drag'){if(dragging){sendInput({cmd:'button',button:'left',state:'up'});dragging=false}lastTap=0}
      else if(!cancel&&mode==='move'&&e.timeStamp-tapT<250&&moved<12&&prefs.tap){sendInput({cmd:'button',button:'left',state:'click'});buzz();lastTap=e.timeStamp}
      mode=null}
    else if(n===2&&mode==='scroll'&&!cancel&&e.timeStamp-twoT<300&&twoMoved<12&&prefs.tap){sendInput({cmd:'button',button:'right',state:'click'});buzz();mode='done'}};
  wrap.addEventListener('pointerup',e=>end(e,false));wrap.addEventListener('pointercancel',e=>end(e,true));
  for(const [id,b] of [['bl','left'],['bm','middle'],['br','right']]){const el=$(id);
    el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);el.classList.add('down');buzz();sendInput({cmd:'button',button:b,state:'down'})});
    const up=()=>{el.classList.remove('down');sendInput({cmd:'button',button:b,state:'up'})};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}
  // typing bar on the pad: the keyboard button opens it without leaving the touchpad
  $('fab').innerHTML=ic('keys');
  const typing=$('typing'),pkb=$('pkb');
  $('fab').onclick=()=>{buzz();typing.hidden=false;pkb.focus();$('hint').style.opacity=0;setTimeout(sizeTrace,50)};
  $('tdone').onclick=()=>{buzz();pkb.blur();pkb.value='';typing.hidden=true;setTimeout(sizeTrace,50)};
  attachText(pkb);
  const xk=$('xkeys');
  keyButton(xk,'Esc',()=>key('escape'),{cls:'k t'});keyButton(xk,'Tab',()=>key('tab'),{cls:'k t'});
  keyButton(xk,'Ctrl',()=>{mods.has('ctrl')?mods.delete('ctrl'):mods.add('ctrl');renderMods()},{cls:'k t',mod:'ctrl'});
  keyButton(xk,'Alt',()=>{mods.has('alt')?mods.delete('alt'):mods.add('alt');renderMods()},{cls:'k t',mod:'alt'});
  for(const [i,k] of [['left','left'],['up','up'],['down','down'],['right','right']])keyButton(xk,ic(i),()=>key(k),{cls:'k t',rep:true,label:k});
  keyButton(xk,ic('bksp'),()=>key('backspace'),{cls:'k t',rep:true,label:'Backspace'});keyButton(xk,ic('enter'),()=>key('enter'),{cls:'k t',label:'Enter'});
})();

/* ---------- keyboard screen ---------- */
(function initKeys(){
  $('kfield').innerHTML=ic('keys')+'<textarea id="kb" rows="1" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="Type to send text to the PC"></textarea>';
  attachText($('kb'));

    b.onclick=()=>{buzz();mods.has(m)?mods.delete(m):mods.add(m);renderMods()};b.onpointerdown=e=>e.preventDefault();$('k-mods').append(b)}
  for(const [l,k,lab,rep] of [['Esc','escape'],['Tab','tab'],[ic('bksp'),'backspace','Backspace',true],[ic('enter'),'enter','Enter'],['Del','delete','Delete',true]])keyButton('k-main',l,()=>key(k),{label:lab,rep});

  for(const [l,k] of [['Home','home'],['End','end'],['PgUp','page_up'],['PgDn','page_down']])keyButton('k-nav',l,()=>key(k),{cls:'k t',rep:k.startsWith('page')});
  for(let i=1;i<=12;i++)keyButton('k-f','F'+i,()=>key('f'+i),{cls:'k t s'});
  for(const [l,k,m] of [['Copy','c',['ctrl']],['Paste','v',['ctrl']],['Cut','x',['ctrl']],['Undo','z',['ctrl']],['Select all','a',['ctrl']],['Save','s',['ctrl']],['Find','f',['ctrl']],['New tab','t',['ctrl']],['Close tab','w',['ctrl']],['Switch window','tab',['alt']],['Launcher','d',['super']]])keyButton('k-sc',l,()=>key(k,m),{cls:'k s t'});
})();


/* slider fill: expose the value as --p (0..1) so the track can show a flat blue fill */
(function(){
  const setP=r=>{const mn=+r.min||0,mx=+r.max||100;r.style.setProperty('--p',String(Math.min(1,Math.max(0,(+r.value-mn)/((mx-mn)||1)))))};
  const sweep=()=>document.querySelectorAll('input[type=range]').forEach(setP);
  addEventListener('input',e=>{if(e.target&&e.target.type==='range')setP(e.target)},true);
  new MutationObserver(sweep).observe(document.body,{childList:true,subtree:true});sweep();
})();

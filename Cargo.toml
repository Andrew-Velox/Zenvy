[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process"] }
evdev = "0.13"
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
opus = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
tempfile = "3"
wayland-client = "0.31"
axum = { version = "0.8", features = ["ws"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
subtle = "2"
qrcode = { version = "0.14", default-features = false }
if-addrs = "0.13"
clap = { version = "4", features = ["derive"] }
zenvy-proto = { path = "crates/zenvy-proto" }
zenvy-core = { path = "crates/zenvy-core" }
zenvy-hyprland = { path = "crates/zenvy-hyprland" }
zenvy-profiler = { path = "crates/zenvy-profiler" }
zenvy-config = { path = "crates/zenvy-config" }
zenvy-auth = { path = "crates/zenvy-auth" }
zenvy-net = { path = "crates/zenvy-net" }
zenvy-input = { path = "crates/zenvy-input" }
zenvy-audio = { path = "crates/zenvy-audio" }
zenvy-stream = { path = "crates/zenvy-stream" }
zenvy-icons = { path = "crates/zenvy-icons" }
zenvy-power = { path = "crates/zenvy-power" }
zenvy-screen = { path = "crates/zenvy-screen" }
zenvy-apps = { path = "crates/zenvy-apps" }
zeroize = "1"
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }
zenvy-brightness = { path = "crates/zenvy-brightness" }
zenvy-media = { path = "crates/zenvy-media" }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"

name: Release

# Push a tag like v0.1.0 (after the version numbers agree: packaging/check-version.sh v0.1.0).
# The result is a DRAFT release: nothing is public until you review it and press Publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write       # create the draft release
  id-token: write       # sign build provenance (Sigstore)
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version numbers must match the tag
        run: packaging/check-version.sh "${GITHUB_REF_NAME}"

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus-dev pkg-config cmake clang
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --locked

      # Same flags as docs/REPRODUCIBLE.md: the binary does not depend on where it was built.
      - name: Build the agent
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: |
          export RUSTFLAGS="--remap-path-prefix=$PWD=/src --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$HOME/.rustup=/rustup -C strip=symbols"
          cargo build --release --locked -p zenvyd

      - name: Package the agent
        run: |
          v="${GITHUB_REF_NAME#v}"
          d="zenvy-${v}-x86_64-linux"
          mkdir -p "dist/$d"
          install -m 0755 target/release/zenvyd "dist/$d/zenvyd"
          cp -r packaging LICENSE README.md SECURITY.md CHANGELOG.md browser-extension "dist/$d/"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@1700000000 -czf "dist/$d.tar.gz" -C dist "$d"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      # Signing uses YOUR keystore, stored only as repository secrets (see docs/RELEASING.md).
      # Without the secrets the APK step is skipped and the release has the agent only.
      - name: Build and sign the Android app
        env:
          KEYSTORE_B64: ${{ secrets.ZENVY_KEYSTORE_BASE64 }}
          ZENVY_KEYSTORE_PASSWORD: ${{ secrets.ZENVY_KEYSTORE_PASSWORD }}
          ZENVY_KEY_ALIAS: ${{ secrets.ZENVY_KEY_ALIAS }}
          ZENVY_KEY_PASSWORD: ${{ secrets.ZENVY_KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No ZENVY_KEYSTORE_BASE64 secret: the Android app is not part of this release."
            exit 0
          fi
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zenvy-release.jks"
          export ZENVY_KEYSTORE="$RUNNER_TEMP/zenvy-release.jks"
          [ -n "$ZENVY_KEY_ALIAS" ] || unset ZENVY_KEY_ALIAS
          [ -n "$ZENVY_KEY_PASSWORD" ] || unset ZENVY_KEY_PASSWORD
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../dist/zenvy-${GITHUB_REF_NAME#v}.apk"
          rm -f "$RUNNER_TEMP/zenvy-release.jks"

      - name: Checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          sha256sum *.tar.gz *.apk | tee SHA256SUMS

      # Artifact attestations need a public repository (or GitHub Enterprise Cloud), so this is skipped while private.
      - name: Sign build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.apk

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.apk
            dist/SHA256SUMS

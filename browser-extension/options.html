<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zenvy Browser Bridge</title>
<style>
:root{color-scheme:dark;--bg:#141415;--card:#19191b;--raised:#232325;--line:rgba(237,237,237,.1);--fg:#ededed;--fg2:#a1a1a6;--accent:#3dd6c0}
*{box-sizing:border-box}body{margin:0;padding:32px 16px;background:var(--bg);color:var(--fg);font:15px/22px system-ui,sans-serif}
main{max-width:480px;margin:0 auto}h1{font-size:22px;line-height:28px;font-weight:500;margin:0 0 8px}
p{color:var(--fg2);margin:0 0 24px}label{display:block;font-size:13px;color:var(--fg2);margin:16px 0 8px}
input[type=text],input[type=password],input[type=number]{width:100%;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin-top:16px}button{height:44px;padding:0 20px;border-radius:10px;border:0;background:var(--fg);color:var(--bg);font:inherit;font-weight:500;cursor:pointer}
#status{margin-top:24px;padding:12px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--fg2)}
#status.ok{color:var(--accent)}
</style></head><body><main>
<h1>Zenvy Browser Bridge</h1>
<p>Lets the Zenvy phone app list, switch and close this browser's tabs. It sends only tab titles and site names to the Zenvy agent on this computer, never full addresses.</p>
<label for="token">Token (run <code>zenvyd browser setup</code>)</label>
<input id="token" type="password" autocomplete="off" spellcheck="false">
<label for="port">Port</label>
<input id="port" type="number" min="1024" max="65535" value="7879">
<div class="row"><input id="enabled" type="checkbox" checked><label for="enabled" style="margin:0">Enabled</label></div>
<div class="row"><button id="save">Save</button></div>
<div id="status">…</div>
<script src="options.js"></script>
</main></body></html>
